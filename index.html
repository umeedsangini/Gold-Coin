<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b10"><title>Gold Coin Miner</title>
<style>
:root{--gold:#f5c451;--gold2:#ffdf86;--muted:#8c94a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#282016 0,#10131b 43%,#090b10 78%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow:hidden}.app{max-width:520px;margin:auto;padding:22px 20px 28px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;color:#c9a75c;font-weight:800}.pill{border:1px solid #594a2b;background:#211d15;padding:8px 12px;border-radius:30px;color:#e9c879;font-size:11px}.heading{text-align:center;margin:26px 0 8px}.heading h1{font-size:27px;margin:0;letter-spacing:1px}.heading p{color:var(--muted);font-size:12px;margin:7px 0}.wallet{margin:18px auto 4px;background:linear-gradient(135deg,#302719,#171711);border:1px solid #80632e;border-radius:18px;padding:14px 24px;text-align:center;min-width:210px;box-shadow:0 10px 35px #0008}.wallet small{color:#c4a45e;letter-spacing:2px;font-size:10px}.balance{font-size:32px;font-weight:850;color:var(--gold2);margin-top:3px}.coin{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff0a8,#d18b18);color:#704400;font-weight:900;font-size:14px;vertical-align:4px;margin-right:5px;box-shadow:0 0 13px #f4bf4b66}.mine{position:relative;height:300px;margin:12px -5px 0;display:flex;align-items:center;justify-content:center}.cave{position:absolute;width:270px;height:235px;border-radius:48% 48% 35% 35%;background:radial-gradient(ellipse at 50% 62%,#6c4a20 0,#352718 42%,#171820 72%);border:2px solid #604b2e;box-shadow:inset 0 0 35px #000,0 0 55px #e9a52b18;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}.rock{position:absolute;border-radius:40%;background:linear-gradient(145deg,#907044,#34291c 65%);box-shadow:inset -7px -8px 10px #0008,0 3px 8px #0008}.r1{width:82px;height:58px;left:calc(50% - 125px);top:160px;transform:rotate(-17deg)}.r2{width:90px;height:65px;right:calc(50% - 130px);top:180px;transform:rotate(18deg)}.r3{width:65px;height:50px;left:calc(50% - 35px);top:215px;background:linear-gradient(145deg,#c18a36,#493017)}.ore{position:absolute;width:13px;height:13px;border-radius:50%;background:#ffd85e;box-shadow:0 0 15px 5px #ffb52e88;animation:glow 1.3s infinite alternate}.o1{top:165px;left:calc(50% - 75px)}.o2{top:205px;right:calc(50% - 85px);animation-delay:.4s}.o3{top:230px;left:calc(50% + 30px);animation-delay:.8s}.miner{position:relative;z-index:2;margin-top:18px;font-size:100px;filter:drop-shadow(0 12px 8px #0009);animation:bob 1.4s ease-in-out infinite}.pick{position:absolute;z-index:3;font-size:60px;top:64px;left:calc(50% + 22px);transform-origin:80% 80%;animation:swing .8s ease-in-out infinite alternate;filter:drop-shadow(0 4px 5px #000)}.spark{position:absolute;z-index:4;color:#ffe18a;font-size:19px;animation:pop .8s infinite}.s1{top:145px;left:calc(50% + 55px)}.s2{top:185px;left:calc(50% - 82px);animation-delay:.3s}.s3{top:120px;left:calc(50% - 30px);animation-delay:.5s}.status{text-align:center;margin-top:-3px}.status strong{font-size:13px;color:#f0d18b;letter-spacing:1px}.timer{font-size:34px;font-weight:800;letter-spacing:3px;margin:6px 0;color:#fff}.sub{font-size:11px;color:var(--muted)}.progress{height:6px;background:#272a31;border-radius:10px;overflow:hidden;margin:14px 10px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#a96b16,#ffe28a);border-radius:10px;transition:width .3s}.note{text-align:center;color:#777f8e;font-size:10px;margin-top:auto;padding-top:20px}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#352816;border:1px solid #b88734;color:#ffe6a0;border-radius:30px;padding:11px 18px;font-size:12px;opacity:0;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes swing{from{transform:rotate(-28deg)}to{transform:rotate(18deg)}}@keyframes glow{to{opacity:.45;transform:scale(.75)}}@keyframes pop{0%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(.5)}}
</style></head><body><main class="app"><header class="top"><div class="brand">GOLD MINE</div><div class="pill">● LIVE MINING</div></header><section class="heading"><h1>Dig. Collect. Shine.</h1><p>Your little gold mine is working</p></section><section class="wallet"><small>YOUR WALLET</small><div class="balance"><span class="coin">G</span><span id="coins">0</span></div></section><section class="mine"><div class="cave"></div><div class="rock r1"></div><div class="rock r2"></div><div class="rock r3"></div><i class="ore o1"></i><i class="ore o2"></i><i class="ore o3"></i><div class="miner">⛏️</div><div class="pick">⚒️</div><b class="spark s1">✦</b><b class="spark s2">✧</b><b class="spark s3">✦</b></section><section class="status"><strong>MINING IN PROGRESS</strong><div class="timer" id="timer">01:00</div><div class="sub">Next Gold Coin in</div><div class="progress"><div class="bar" id="bar"></div></div></section><footer class="note">Keep this screen on to continue mining<br>1 completed minute = 1 Gold Coin</footer></main><div class="toast" id="toast">+1 Gold Coin added to wallet!</div>
<script>
const COIN_KEY='gold_miner_coins_v1', ACTIVE_KEY='gold_miner_active_ms_v1';let coins=Number(localStorage.getItem(COIN_KEY)||0),accrued=Number(localStorage.getItem(ACTIVE_KEY)||0),sessionStart=Date.now();const coinEl=document.getElementById('coins'),timerEl=document.getElementById('timer'),bar=document.getElementById('bar'),toast=document.getElementById('toast');coinEl.textContent=coins;let lastCount=Math.floor(accrued/60000);function tick(){const elapsed=Math.max(0,accrued+Date.now()-sessionStart),completed=Math.floor(elapsed/60000);localStorage.setItem(ACTIVE_KEY,String(elapsed));if(completed>lastCount){const earned=completed-lastCount;coins+=earned;localStorage.setItem(COIN_KEY,String(coins));coinEl.textContent=coins;lastCount=completed;toast.textContent='+'+earned+' Gold Coin'+(earned>1?'s':'')+' added to wallet!';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}const remain=60000-(elapsed%60000);const sec=Math.ceil(remain/1000);timerEl.textContent='00:'+String(sec).padStart(2,'0');bar.style.width=((elapsed%60000)/60000*100)+'%'}tick();setInterval(tick,250);
</script></body></html>
